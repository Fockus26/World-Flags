name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    env:
      # Valores de relleno: el cliente de Supabase se crea al importar y falla sin
      # URL/clave. El build no llama a la red, así que no hacen falta los reales.
      PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      PUBLIC_VAPID_PUBLIC_KEY: placeholder-vapid-key
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bunx astro check

      # No bloqueante por ahora: src/ ya trae 2 errores de lint y 14 de formato
      # previos a este workflow. Quitar continue-on-error cuando se limpien.
      - name: Lint
        run: bunx biome check ./src
        continue-on-error: true

      - name: Build
        run: bun run build
