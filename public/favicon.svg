<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>

  <!-- full-bleed background (safe for maskable icons) -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- subtle card outline hint (flashcard theme) -->
  <rect x="66" y="66" width="380" height="380" rx="44"
        fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="10"/>

  <!-- flagpole -->
  <rect x="172" y="140" width="16" height="248" rx="8" fill="#ffffff"/>
  <circle cx="180" cy="130" r="11" fill="#ffffff"/>

  <!-- waving flag -->
  <path d="M 188 150
           C 230 132, 250 168, 292 150
           C 316 140, 332 146, 346 154
           L 346 226
           C 332 218, 316 212, 292 222
           C 250 240, 230 204, 188 222
           Z"
        fill="#ffffff"/>

  <!-- two subtle stripes on the flag suggesting a flag pattern -->
  <path d="M 188 150
           C 230 132, 250 168, 292 150
           C 316 140, 332 146, 346 154
           L 346 178
           C 332 170, 316 164, 292 174
           C 250 192, 230 156, 188 174
           Z"
        fill="#2563eb" fill-opacity="0.55"/>
</svg>
