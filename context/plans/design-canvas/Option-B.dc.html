<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Plus Jakarta Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    .segment {
      transition: color 150ms ease;
      cursor: pointer;
    }
    .segment:active { transform: scale(0.98); }
    .pill {
      transition: transform 220ms cubic-bezier(0.65,0,0.35,1), background-color 150ms ease;
    }
  </style>
</helmet>

<div style="min-height: 100%; width: 100%; background: {{pageBg}}; display: flex; justify-content: center; padding: 28px 16px;">
  <div style="width: 100%; max-width: 358px; background: {{surface}}; border: 1px solid {{surfaceBorder}}; border-radius: 22px; padding: 18px; display: flex; flex-direction: column; gap: 16px; box-shadow: 0 20px 40px -24px rgba(20,15,45,0.35);">

    <!-- Encabezado breve, para dar contexto -->
    <div style="display: flex; align-items: center; gap: 10px;">
      <div style="width: 40px; height: 40px; border-radius: 999px; background: {{primarySoft}}; flex-shrink: 0;"></div>
      <div style="min-width: 0; display: flex; flex-direction: column; gap: 3px;">
        <div style="font-weight: 800; font-size: 14px; color: {{textMain}};">Explorador</div>
        <div style="height: 6px; border-radius: 999px; background: {{surfaceHover}}; overflow: hidden;">
          <div style="width: 4%; height: 100%; background: {{primary}};"></div>
        </div>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px;">
      <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.02em; color: {{textMuted}};">Qué practicar</span>

      <!-- Barra segmentada: una sola píldora que se desliza al elegido -->
      <div style="position: relative; display: flex; padding: 4px; border-radius: 16px; background: {{surfaceHover}};">
        <div class="pill" style="position: absolute; top: 4px; bottom: 4px; left: {{pillLeft}}; width: {{pillWidth}}; border-radius: 12px; background: {{surface}}; box-shadow: 0 6px 14px -8px rgba(20,15,45,0.4);"></div>

        <sc-for list="{{modes}}" as="mode">
          <div class="segment" onClick="{{mode.pick}}" style="position: relative; z-index: 1; flex: 1; display: flex; align-items: center; justify-content: center; gap: 7px; padding: 10px 8px;">
            <sc-if value="{{mode.isCountries}}">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{mode.iconColor}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="9"></circle>
                <path d="M3 12h18"></path>
                <path d="M12 3c2.5 2.6 3.8 5.7 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.7-3.8-9s1.3-6.4 3.8-9z"></path>
              </svg>
            </sc-if>
            <sc-if value="{{mode.isFlags}}">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{mode.iconColor}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M5 21V4"></path>
                <path d="M5 4.5c1.6-1 3.2-1 4.8 0s3.2 1 4.8 0 3.2-1 4.4-.3v9c-1.2-.7-2.8-.7-4.4.3-1.6 1-3.2 1-4.8 0s-3.2-1-4.8 0"></path>
              </svg>
            </sc-if>
            <span style="font-weight: 800; font-size: 13.5px; color: {{mode.iconColor}};">{{mode.title}}</span>
          </div>
        </sc-for>
      </div>

      <!-- Vista previa del modo elegido: icono grande + texto -->
      <div style="display: flex; align-items: center; gap: 14px; padding: 14px; border-radius: 16px; background: {{previewSoft}}; border: 1px solid {{previewBorder}};">
        <div style="width: 46px; height: 46px; border-radius: 13px; background: {{previewAccent}}; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
          <sc-if value="{{isCountries}}">
            <svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="{{previewIconColor}}" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="9"></circle>
              <path d="M3 12h18"></path>
              <path d="M12 3c2.5 2.6 3.8 5.7 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.7-3.8-9s1.3-6.4 3.8-9z"></path>
            </svg>
          </sc-if>
          <sc-if value="{{isFlags}}">
            <svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="{{previewIconColor}}" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
              <path d="M5 21V4"></path>
              <path d="M5 4.5c1.6-1 3.2-1 4.8 0s3.2 1 4.8 0 3.2-1 4.4-.3v9c-1.2-.7-2.8-.7-4.4.3-1.6 1-3.2 1-4.8 0s-3.2-1-4.8 0"></path>
            </svg>
          </sc-if>
        </div>
        <div style="min-width: 0; display: flex; flex-direction: column; gap: 2px;">
          <span style="font-weight: 800; font-size: 14.5px; color: {{textMain}};">{{previewTitle}}</span>
          <span style="font-size: 12.5px; line-height: 1.35; color: {{textMuted}};">{{previewDescription}}</span>
        </div>
      </div>
    </div>

    <div style="height: 1px; background: {{surfaceBorder}};"></div>

    <div style="font-size: 24px; font-weight: 800; color: {{textMain}}; line-height: 1.15;">{{heading}}</div>
  </div>
</div>

</x-dc>
<script data-dc-script data-props='{
  "theme": {"editor": "enum", "options": ["Claro", "Oscuro"], "default": "Claro", "section": "Tema"},
  "selected": {"editor": "enum", "options": ["countries", "flags"], "default": "countries", "section": "Estado"}
}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { selected: props.selected ?? "countries" };
  }

  pick(id) {
    this.setState({ selected: id });
  }

  renderVals() {
    const isDark = (this.props.theme ?? "Claro") === "Oscuro";
    const selected = this.state.selected;
    const isCountries = selected === "countries";

    const palette = isDark
      ? {
          pageBg: "#14121f",
          surface: "#1b1930",
          surfaceHover: "#262238",
          surfaceBorder: "#34304a",
          textMain: "#f1eefc",
          textMuted: "#a29cc0",
          primary: "#9b8bff",
          primarySoft: "#2c2650",
          primaryBorder: "#493f7d",
          secondary: "#e19bec",
          secondarySoft: "#3a1f45",
          secondaryBorder: "#5c3566",
        }
      : {
          pageBg: "#f2f1f8",
          surface: "#ffffff",
          surfaceHover: "#f1eff9",
          surfaceBorder: "#e2dff1",
          textMain: "#1c1b2e",
          textMuted: "#6b6880",
          primary: "#6d5ef0",
          primarySoft: "#ecebfe",
          primaryBorder: "#cfc8fb",
          secondary: "#b34bd1",
          secondarySoft: "#f6e9fb",
          secondaryBorder: "#e6c6f2",
        };

    const modes = [
      {
        id: "countries",
        title: "Países",
        isCountries: true,
        isFlags: false,
        iconColor: isCountries ? palette.primary : palette.textMuted,
        pick: () => this.pick("countries"),
      },
      {
        id: "flags",
        title: "Banderas",
        isCountries: false,
        isFlags: true,
        iconColor: !isCountries ? palette.secondary : palette.textMuted,
        pick: () => this.pick("flags"),
      },
    ];

    return {
      pageBg: palette.pageBg,
      surface: palette.surface,
      surfaceHover: palette.surfaceHover,
      surfaceBorder: palette.surfaceBorder,
      textMain: palette.textMain,
      textMuted: palette.textMuted,
      primary: palette.primary,
      primarySoft: palette.primarySoft,
      modes,
      isCountries,
      isFlags: !isCountries,
      pillLeft: isCountries ? "4px" : "50%",
      pillWidth: "calc(50% - 4px)",
      previewAccent: isCountries ? palette.primary : palette.secondary,
      previewSoft: isCountries ? palette.primarySoft : palette.secondarySoft,
      previewBorder: isCountries ? palette.primaryBorder : palette.secondaryBorder,
      previewIconColor: isDark ? "#14121f" : "#ffffff",
      previewTitle: isCountries ? "Países" : "Banderas",
      previewDescription: isCountries
        ? "Aprende qué país va en cada continente"
        : "Reconoce la bandera de cada país",
      heading: isCountries ? "Aprende los países del mundo" : "Aprende las banderas del mundo",
    };
  }
}
</script>
</body>
</html>
