<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Plus Jakarta Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    a { color: {{accent}}; }
    a:hover { color: {{accentHover}}; }
    .card {
      transition: border-color 150ms ease, background-color 150ms ease, transform 150ms ease;
      cursor: pointer;
    }
    .card:active { transform: scale(0.99); }
  </style>
</helmet>

<div style="min-height: 100%; width: 100%; background: {{pageBg}}; display: flex; justify-content: center; padding: 28px 16px;">
  <div style="width: 100%; max-width: 358px; background: {{surface}}; border: 1px solid {{surfaceBorder}}; border-radius: 22px; padding: 18px; display: flex; flex-direction: column; gap: 16px; box-shadow: 0 20px 40px -24px rgba(20,15,45,0.35);">

    <!-- Encabezado breve, para dar contexto -->
    <div style="display: flex; align-items: center; gap: 10px;">
      <div style="width: 40px; height: 40px; border-radius: 999px; background: {{primarySoft}}; flex-shrink: 0;"></div>
      <div style="min-width: 0; display: flex; flex-direction: column; gap: 3px;">
        <div style="font-weight: 800; font-size: 14px; color: {{textMain}};">Explorador</div>
        <div style="height: 6px; border-radius: 999px; background: {{surfaceHover}}; overflow: hidden;">
          <div style="width: 4%; height: 100%; background: {{primary}};"></div>
        </div>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px;">
      <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.02em; color: {{textMuted}};">Qué practicar</span>

      <sc-for list="{{modes}}" as="mode">
        <div
          class="card"
          onClick="{{mode.pick}}"
          style="display: flex; align-items: center; gap: 14px; padding: 14px; border-radius: 16px; border: 1.5px solid {{mode.borderColor}}; background: {{mode.bgColor}};"
        >
          <div style="width: 44px; height: 44px; border-radius: 13px; background: {{mode.iconBg}}; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
            <sc-if value="{{mode.isCountries}}">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="{{mode.iconColor}}" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="9"></circle>
                <path d="M3 12h18"></path>
                <path d="M12 3c2.5 2.6 3.8 5.7 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.7-3.8-9s1.3-6.4 3.8-9z"></path>
              </svg>
            </sc-if>
            <sc-if value="{{mode.isFlags}}">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="{{mode.iconColor}}" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                <path d="M5 21V4"></path>
                <path d="M5 4.5c1.6-1 3.2-1 4.8 0s3.2 1 4.8 0 3.2-1 4.4-.3v9c-1.2-.7-2.8-.7-4.4.3-1.6 1-3.2 1-4.8 0s-3.2-1-4.8 0"></path>
              </svg>
            </sc-if>
          </div>

          <div style="min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 2px;">
            <span style="font-weight: 800; font-size: 15px; color: {{textMain}};">{{mode.title}}</span>
            <span style="font-size: 12.5px; line-height: 1.35; color: {{textMuted}};">{{mode.description}}</span>
          </div>

          <div style="width: 22px; height: 22px; border-radius: 999px; flex-shrink: 0; border: 1.5px solid {{mode.checkBorder}}; background: {{mode.checkBg}}; display: flex; align-items: center; justify-content: center;">
            <sc-if value="{{mode.selected}}">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="{{mode.checkIcon}}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 12l6 6L20 6"></path>
              </svg>
            </sc-if>
          </div>
        </div>
      </sc-for>
    </div>

    <div style="height: 1px; background: {{surfaceBorder}};"></div>

    <div style="font-size: 24px; font-weight: 800; color: {{textMain}}; line-height: 1.15;">{{heading}}</div>
  </div>
</div>

</x-dc>
<script data-dc-script data-props='{
  "theme": {"editor": "enum", "options": ["Claro", "Oscuro"], "default": "Claro", "section": "Tema"},
  "selected": {"editor": "enum", "options": ["countries", "flags"], "default": "countries", "section": "Estado"}
}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { selected: props.selected ?? "countries" };
  }

  pick(id) {
    this.setState({ selected: id });
  }

  renderVals() {
    const isDark = (this.props.theme ?? "Claro") === "Oscuro";
    const selected = this.state.selected;

    const palette = isDark
      ? {
          pageBg: "#14121f",
          surface: "#1b1930",
          surfaceHover: "#262238",
          surfaceBorder: "#34304a",
          textMain: "#f1eefc",
          textMuted: "#a29cc0",
          primary: "#9b8bff",
          primaryHover: "#b3a6ff",
          primarySoft: "#2c2650",
          primaryBorder: "#493f7d",
          secondary: "#e19bec",
          secondarySoft: "#3a1f45",
          secondaryBorder: "#5c3566",
        }
      : {
          pageBg: "#f2f1f8",
          surface: "#ffffff",
          surfaceHover: "#f1eff9",
          surfaceBorder: "#e2dff1",
          textMain: "#1c1b2e",
          textMuted: "#6b6880",
          primary: "#6d5ef0",
          primaryHover: "#5b4bdb",
          primarySoft: "#ecebfe",
          primaryBorder: "#cfc8fb",
          secondary: "#b34bd1",
          secondarySoft: "#f6e9fb",
          secondaryBorder: "#e6c6f2",
        };

    function modeCard({ id, title, description, isCountries, isFlags, accent, accentSoft, accentBorder }) {
      const isSelected = selected === id;
      return {
        title,
        description,
        isCountries,
        isFlags,
        selected: isSelected,
        borderColor: isSelected ? accentBorder : palette.surfaceBorder,
        bgColor: isSelected ? accentSoft : palette.surface,
        iconBg: isSelected ? accent : palette.surfaceHover,
        iconColor: isSelected ? (isDark ? "#14121f" : "#ffffff") : palette.textMuted,
        checkBorder: isSelected ? accent : palette.surfaceBorder,
        checkBg: isSelected ? accent : "transparent",
        checkIcon: isDark ? "#14121f" : "#ffffff",
        pick: () => this.pick(id),
      };
    }

    const modes = [
      modeCard({
        id: "countries",
        title: "Países",
        description: "Aprende qué país va en cada continente",
        isCountries: true,
        isFlags: false,
        accent: palette.primary,
        accentSoft: palette.primarySoft,
        accentBorder: palette.primaryBorder,
      }),
      modeCard({
        id: "flags",
        title: "Banderas",
        description: "Reconoce la bandera de cada país",
        isCountries: false,
        isFlags: true,
        accent: palette.secondary,
        accentSoft: palette.secondarySoft,
        accentBorder: palette.secondaryBorder,
      }),
    ];

    return {
      pageBg: palette.pageBg,
      surface: palette.surface,
      surfaceHover: palette.surfaceHover,
      surfaceBorder: palette.surfaceBorder,
      textMain: palette.textMain,
      textMuted: palette.textMuted,
      primary: palette.primary,
      primarySoft: palette.primarySoft,
      accent: palette.primary,
      accentHover: palette.primaryHover,
      modes,
      heading: selected === "countries" ? "Aprende los países del mundo" : "Aprende las banderas del mundo",
    };
  }
}
</script>
</body>
</html>
